spring.application.name=sports-talent-backend

# Server
server.port=${SERVER_PORT:8080}

# File upload
spring.servlet.multipart.max-file-size=${VIDEO_MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${VIDEO_MAX_REQUEST_SIZE:100MB}

# Database — configure credentials through environment variables
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sports_talent_assessment?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:sports_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Security / JWT — set a strong secret in the deployment environment
jwt.secret=${JWT_SECRET:}
jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}

# Logging
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
