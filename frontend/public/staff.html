<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brogrow | Staff Portal</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#070910;color:#eef0f7;display:grid;place-items:center;padding:24px}.wrap{width:min(480px,100%)}.brand{display:flex;align-items:center;gap:13px;margin-bottom:24px}.logo{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#6366f1,#06b6d4);font-size:24px}.eyebrow{margin:0 0 5px;color:#8d94ff;font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.brand h1{margin:0;font-size:24px}.card{background:#11131c;border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:28px;box-shadow:0 25px 80px #0008}.title{font-size:25px;font-weight:850;margin:0 0 7px}.sub{color:#8e97ab;font-size:13px;margin:0 0 22px;line-height:1.5}form{display:grid;gap:15px}label{display:grid;gap:7px;color:#a8b0c1;font-size:12px;font-weight:750}input,select{width:100%;border:1px solid rgba(255,255,255,.11);background:#080a10;color:#eef0f7;border-radius:11px;padding:13px;font:inherit;outline:none}.primary{border:0;background:linear-gradient(135deg,#6366f1,#4f46e5);color:white;border-radius:11px;padding:14px;font-size:14px;font-weight:850;cursor:pointer}.message{min-height:18px;font-size:12px;color:#f59e0b}.link{display:block;text-align:center;margin-top:17px;color:#8f98ff;font-size:12px;text-decoration:none}</style></head><body><div class="wrap"><div class="brand"><div class="logo">🏆</div><div><p class="eyebrow">Brogrow Staff Portal</p><h1>Coach & Academy Intelligence</h1></div></div><div class="card"><h2 class="title">Staff access</h2><p class="sub">Secure sign in for coaches, academies and administrators.</p><form id="form"><label>Staff email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><label>Account type<select id="role"><option value="COACH">Coach</option><option value="ACADEMY">Academy</option><option value="ADMIN">Admin</option></select></label><div class="message" id="message"></div><button class="primary" id="submit">Sign in to Staff Portal</button></form><a class="link" href="/athlete.html">← Athlete Portal</a></div></div><script>const API='http://localhost:8080/api';document.getElementById('form').onsubmit=async e=>{e.preventDefault();let b=document.getElementById('submit'),m=document.getElementById('message');b.disabled=true;m.textContent='Connecting…';try{let r=await fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});let d=await r.json();if(!r.ok)throw Error(d.message||'Login failed');let selected=document.getElementById('role').value;if(d.role!==selected)throw Error('This account is '+d.role+'. Choose the correct staff account type.');localStorage.setItem('sportsTalentAuth',d.token);localStorage.setItem('sportsTalentRole',d.role);localStorage.setItem('sportsTalentName',`${d.firstName||''} ${d.lastName||''}`.trim()||document.getElementById('email').value);location.href='/';}catch(x){m.textContent=x.message}finally{b.disabled=false}}</script></body></html>
